name = "villescrapbook"
main = "worker/worker.ts"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
preview_urls = true

[observability]
enabled = true

[assets]
not_found_handling = "single-page-application"
directory = "./dist/client"
binding = "ASSETS"
# Only API routes should hit the Worker first; everything else is the SPA shell.
run_worker_first = ["/api/*"]

# Set up the durable object used for each tldraw room
[durable_objects]
bindings = [{ name = "TLDRAW_DURABLE_OBJECT", class_name = "TldrawDurableObject" }]

# Durable objects require migrations to create/modify/delete them
# Using new_sqlite_classes for SQLite-backed storage
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TldrawDurableObject"]

# Uploaded images/videos. Room data lives in Durable Object SQLite.
[[r2_buckets]]
binding = "TLDRAW_BUCKET"
bucket_name = "whiteboard"
preview_bucket_name = "whiteboard-preview"
